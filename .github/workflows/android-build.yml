name: SUZO Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile Java sources
        run: |
          mkdir -p build/classes build/dex
          find src/main/java -name "*.java" > build/sources.txt
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d build/classes @build/sources.txt

      - name: Compile resources and create APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" compile --dir res -o build/compiled-res.zip
          "$BT/aapt2" link -o build/SUZO-unsigned.apk \
            -I "$ANDROID_HOME/platforms/android-36/android.jar" \
            --manifest AndroidManifest.xml --min-sdk-version 23 \
            --target-sdk-version 36 -R build/compiled-res.zip
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 \
            --lib "$ANDROID_HOME/platforms/android-36/android.jar" \
            --min-api 23 --output build/dex \
            $(find build/classes -name "*.class")
          (cd build/dex && zip -q -j ../SUZO-unsigned.apk classes.dex)
          "$BT/aapt" dump badging build/SUZO-unsigned.apk

      - name: Upload unsigned test APK
        uses: actions/upload-artifact@v4
        with:
          name: suzo-launcher-unsigned
          path: build/SUZO-unsigned.apk
